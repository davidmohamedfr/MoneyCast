services:
  # Build custom PHP 8.4 image from Dockerfile
  php-fpm:
    build:
      context: .
      dockerfile: .warden/Dockerfile.php
      args:
        PHP_VERSION: "8.4"
    environment:
      - NODE_VERSION=24
    volumes:
      - .:/var/www/html:cached
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Override database to use Supabase PostgreSQL image
  db:
    image: supabase/postgres:15.1.1.54
    environment:
      - POSTGRES_DB=moneycast
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - supabase_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneycast"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis with AOF persistence
  redis:
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass devpassword

  # Vite dev server for HMR
  vite:
    build:
      context: .
      dockerfile: .warden/Dockerfile.php
      args:
        PHP_VERSION: "8.4"
    volumes:
      - .:/var/www/html:cached
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_DEV_SERVER_URL=https://moneycast.local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/@vite/client || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      # HTTP routes for Vite assets
      - traefik.http.routers.${WARDEN_ENV_NAME}-vite.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/@vite`, `/@id`, `/resources`, `/node_modules`)
      - traefik.http.routers.${WARDEN_ENV_NAME}-vite.tls=true
      - traefik.http.routers.${WARDEN_ENV_NAME}-vite.priority=100
      - traefik.http.services.${WARDEN_ENV_NAME}-vite.loadbalancer.server.port=5173
    networks:
      - warden
      - default

  # Meilisearch for full-text search
  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=masterKey123
    volumes:
      - meilisearch_data:/meili_data
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WARDEN_ENV_NAME}-meilisearch.rule=Host(`meilisearch.${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.${WARDEN_ENV_NAME}-meilisearch.tls=true
      - traefik.http.services.${WARDEN_ENV_NAME}-meilisearch.loadbalancer.server.port=7700
    networks:
      - warden
      - default

  # Netdata for system monitoring
  netdata:
    image: netdata/netdata:latest
    hostname: moneycast-netdata
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=
      - NETDATA_CLAIM_ROOMS=
      - DOCKER_HOST=/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WARDEN_ENV_NAME}-netdata.rule=Host(`netdata.${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.${WARDEN_ENV_NAME}-netdata.tls=true
      - traefik.http.services.${WARDEN_ENV_NAME}-netdata.loadbalancer.server.port=19999
    networks:
      - warden
      - default

  # Queue worker for default priority
  queue-worker:
    build:
      context: .
      dockerfile: .warden/Dockerfile.php
      args:
        PHP_VERSION: "8.4"
    depends_on:
      php-fpm:
        condition: service_healthy
    volumes:
      - .:/var/www/html:cached
    command: |
      sh -c "
        while ! nc -z db 5432; do sleep 1; done &&
        while ! nc -z redis 6379; do sleep 1; done &&
        php artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
      "
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Queue worker for high priority
  queue-worker-high:
    build:
      context: .
      dockerfile: .warden/Dockerfile.php
      args:
        PHP_VERSION: "8.4"
    depends_on:
      php-fpm:
        condition: service_healthy
    volumes:
      - .:/var/www/html:cached
    command: |
      sh -c "
        while ! nc -z db 5432; do sleep 1; done &&
        while ! nc -z redis 6379; do sleep 1; done &&
        php artisan queue:work --queue=high --sleep=3 --tries=3 --max-time=3600
      "
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Override Warden's nginx to add Vite proxy config
  nginx:
    volumes:
      - ./.warden/nginx/vite.conf:/etc/nginx/default.d/vite.conf:ro

  # Forecasting service placeholder
  forecast:
    image: nginx:alpine
    volumes:
      - ./.warden/nginx/forecast.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WARDEN_ENV_NAME}-forecast.rule=Host(`forecast.${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.${WARDEN_ENV_NAME}-forecast.tls=true
      - traefik.http.services.${WARDEN_ENV_NAME}-forecast.loadbalancer.server.port=80
    networks:
      - warden
      - default

volumes:
  supabase_db:
  redis_data:
  meilisearch_data:

networks:
  warden:
    external: true
