# HTTP to HTTPS redirect for Mailpit
server {
    listen 80;
    listen [::]:80;
    server_name mailpit.moneycast.local;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server for Mailpit
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mailpit.moneycast.local;

    # SSL certificate (wildcard for *.moneycast.local)
    ssl_certificate /etc/nginx/certs/moneycast.local.pem;
    ssl_certificate_key /etc/nginx/certs/moneycast.local-key.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to Mailpit container
    location / {
        proxy_pass http://mailpit:8025;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support for Mailpit real-time updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
