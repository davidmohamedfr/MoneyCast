services:
  cert-generator:
    build:
      context: docker/mkcert
      dockerfile: Dockerfile
    container_name: moneycast_cert_generator
    volumes:
      - ssl_certs:/certs
    networks:
      - moneycast
    profiles:
      - https

  postgres:
    image: supabase/postgres:15.1.1.54
    container_name: moneycast_postgres
    restart: unless-stopped
    # SECURITY: Set these in .env file - no defaults for production safety
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_PORT: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    networks:
      - moneycast
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: moneycast_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - moneycast
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneycast_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=default --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
    networks:
      - moneycast
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[a]rtisan queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  queue-worker-high:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneycast_queue_worker_high
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=high --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
    networks:
      - moneycast
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[a]rtisan queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneycast_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE required}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD required}
    networks:
      - moneycast
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vite:
    image: node:24-alpine
    container_name: moneycast_vite
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ssl_certs:/certs:ro
    ports:
      - "5173:5173"
    networks:
      - moneycast
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=development
      - VITE_DEV_SERVER_URL=https://moneycast.local:5173
    command: sh -c "npm install && npm run dev"
    profiles:
      - https

  nginx:
    image: nginx:1.25-alpine
    container_name: moneycast_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - moneycast
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  moneycast:
    driver: bridge
