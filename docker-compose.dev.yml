# Development environment overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - XDEBUG_MODE=${XDEBUG_MODE:-debug}
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - VITE_DEV_SERVER_URL=http://vite.moneycast.local
    volumes:
      - .:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

  nginx:
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_conf_dev:/etc/nginx/conf.d
      - ./docker/nginx/conf.d/app.dev.conf:/etc/nginx/conf.d/app.conf:ro
      - ./docker/nginx/conf.d/mailpit.dev.conf:/etc/nginx/conf.d/mailpit.conf:ro
      - ./docker/nginx/conf.d/vite.dev.conf:/etc/nginx/conf.d/vite.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/logs/nginx:/var/log/nginx

  vite:
    image: node:24-alpine
    container_name: moneycast_vite
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - moneycast
    extra_hosts:
      - "vite.moneycast.local:127.0.0.1"
    depends_on:
      app:
        condition: service_healthy
    command: sh -c "echo 'Waiting for app container to generate Wayfinder types...' && sleep 5 && npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_WAYFINDER_SKIP_TYPES=true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mailpit:
    image: axllent/mailpit:latest
    container_name: moneycast_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - moneycast
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nginx_conf_dev:
    driver: local
  mailpit_data:
    driver: local
